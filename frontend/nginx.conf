# Serves the Vite production build and proxies API calls to the backend
# service on the compose network. Same-origin, so no CORS involved.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: cache aggressively (Vite fingerprints filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
